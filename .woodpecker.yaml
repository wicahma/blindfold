# Blindfold CI — runs the full test matrix on every push.
# Repo checkout dir is the `blindfold` package itself; put its parent on
# PYTHONPATH so `import blindfold` resolves, plus the hermes-agent source for
# the integration suites.
steps:
  - name: unit + adapters
    image: python:3.11
    commands:
      - export REPO=$(pwd)
      - export PYTHONPATH=$(dirname $REPO)
      - python3 tests/core/test_transforms.py
      - python3 tests/core/test_discover.py
      - python3 tests/adapters/test_gateway.py
      - python3 tests/adapters/test_gateway_hook.py
      - python3 tests/adapters/test_gateway_e2e.py
      - python3 tests/adapters/test_gateway_standalone.py
      - python3 tests/adapters/test_openwebui.py
      - python3 tests/adapters/test_qcli.py
      - python3 tests/adapters/test_hooks_generic.py
      - python3 tests/adapters/test_mcp.py
      - python3 tests/adapters/test_hook_filecontent.py
      - python3 tests/adapters/test_scanner.py
      - python3 tests/adapters/test_cli_config.py

  - name: hermes integration
    image: python:3.11
    environment:
      HERMES_REDACT_SECRETS: "true"
    commands:
      - pip install --no-cache-dir hermes-agent
      - export PYTHONPATH=$(python3 -c "import hermes_cli, os; print(os.path.dirname(os.path.dirname(hermes_cli.__file__)))")
      - python3 tests/test_mid_session.py
      - python3 tests/e2e_hermes.py
      - export PYTHONPATH=$PYTHONPATH:$(pwd)
      - python3 tests/adapters/test_real_kwarg.py

  - name: secret sweep
    image: python:3.11
    commands:
      - python3 tests/sweep_secrets.py
